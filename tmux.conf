# tmux.conf — shared across Mac + Linux (symlinked to ~/.tmux.conf by
# symlink_dotfiles.sh). The persistent sessions on gibson/kewtie use this;
# reach them with `mgibson` / `mkewtie` (see machines.sh + the `mux` picker).
# Reload after editing: prefix then r.

# ── Prefix ─────────────────────────────────────────────────────────────────
# Remapped from the default C-b to C-a (easier reach). Because C-a is also
# "jump to start of line" in the shell/Claude, `prefix` then C-a sends a
# literal C-a through to the app — so you keep line-start with a double-tap.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Feel / correctness ───────────────────────────────────────────────────────
set -sg escape-time 0          # no lag after Escape (vim, TUIs feel instant)
set -g focus-events on         # apps inside tmux see focus in/out
set -g history-limit 50000     # long scrollback for logs
set -g mouse on                # click panes, drag borders, scroll
set -g base-index 1            # windows start at 1 (matches the number row)
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # no gaps in the window list after closing one

# ── Truecolor + clipboard ────────────────────────────────────────────────────
# RGB so themes render true; clipboard feature lets tmux emit OSC 52.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:clipboard"
# OSC 52: copying inside tmux (even over SSH on gibson/kewtie) lands in the
# LOCAL Mac clipboard, forwarded through Ghostty. No pbcopy/xclip on the boxes.
set -g set-clipboard on

# ── Sessions ──────────────────────────────────────────────────────────────
# No default single-key binding exists for creating a session from inside
# tmux (rename via $ is default; create otherwise means the command prompt
# or `mux` from a plain shell) — add one so it's actually exposable in the
# hints bar below.
bind a command-prompt -p "new session name:" "new-session -s '%%'"

# ── Splits: intuitive keys, open in the current pane's directory ─────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"  # same as | but no shift needed
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation (vim-style) + resize (repeatable) ────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode: vi keys, yank to clipboard (via OSC 52 above) ──────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ── Reload ───────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Help (prefix ?) — curated cheat sheet popup via `mux help` ────────────────
# Overrides the default prefix-? (full key list, still at prefix : list-keys).
bind ? display-popup -E -w 80 -h 32 "~/.local/bin/mux help; printf '\n  press enter to close…'; read"

# ── Status bar ───────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour236,fg=colour248"

# Left: session name in a highlighted block.
set -g status-left "#[bg=colour110,fg=colour235,bold] #S #[bg=colour236,fg=colour110]▏"
set -g status-left-length 30

# Right: hostname · date · time.
set -g status-right "#[fg=colour109]#h #[fg=colour242]· #[fg=colour248]%a %b %d #[fg=colour242]· #[fg=colour248]%H:%M "
set -g status-right-length 60

# Window list: active window highlighted like the session block.
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[bg=colour110,fg=colour235,bold] #I:#W#F "
setw -g window-status-separator ""

# Pane borders + messages pick up the same accent.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour110"
set -g message-style "bg=colour110,fg=colour235"

# ── Shortcut hints (second status line) ──────────────────────────────────────
# Zellij-inspired "training wheels" (todo #165): the full cheat sheet already
# exists via `mux help` / prefix-?, but both require actively running
# something. This is the always-visible version. Keystrokes are bold (| - .
# etc. are hard to tell apart otherwise); each hierarchy level (session/
# window/pane) keeps its own color. All keys are prefix-first. Toggle off
# once memorized; prefix-? still has the fuller reference.
set -g status 2
# Session and the hide-hint drop below 100 columns — Window/Pane are the
# ones you actually reach for; Session can hide on a narrow split.
set -g status-format[1] "#[align=centre]#{?#{e|>=:#{client_width},100},#[fg=colour108]#[bold]Session #[nobold]#[fg=colour248]new #[bold]a#[nobold]  rename #[bold]$#[nobold]  #[fg=colour242]│  ,}#[fg=colour75]#[bold]Window #[nobold]#[fg=colour248]new #[bold]c#[nobold]  rename #[bold],#[nobold]  nav #[bold]n#[nobold]/#[bold]p#[nobold]  #[fg=colour242]│  #[fg=colour176]#[bold]Pane #[nobold]#[fg=colour248]vert #[bold]|#[nobold]  horiz #[bold]-#[nobold]  kill #[bold]x#[nobold]  zoom #[bold]z#[nobold]#{?#{e|>=:#{client_width},100},  #[fg=colour242]│  #[fg=colour248]hide #[bold]\`#[nobold],}"
bind \` if -F '#{==:#{status},2}' 'set -g status on' 'set -g status 2'

# ── Plugins (TPM) ──────────────────────────────────────────────────────────
# Ticket #183: persist tmux sessions across reboots — resurrect snapshots
# session/window/pane layout + cwd + scrollback, continuum autosaves and
# auto-restores the moment tmux next starts with no existing sessions (i.e.
# the first `mux`/attach after a reboot). tpm/tpack were both considered;
# went with tpm (brew: `brew install tpm`, in both bootstrap PACKAGES arrays)
# for being the established standard over tpack's newer/less-proven TUI
# fork. tmux-assistant-resurrect is early-stage (author's own words: "expect
# rough edges") but tried deliberately — it auto-writes a Claude Code
# SessionStart hook into ~/.claude/settings.json to resume `claude --resume
# <id>` in the right pane on restore, instead of a bare relaunch. Disabling
# any of these later is mostly just commenting out its @plugin line (the
# assistant-resurrect Claude Code hook is the one exception — that needs
# manual cleanup in settings.json too, since installing it edits that file
# directly rather than living only in this config).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'timvw/tmux-assistant-resurrect'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Last line, hard TPM requirement. $(brew --prefix tpm) instead of a
# hardcoded path so this one shared tmux.conf resolves correctly on both
# linuxbrew (kewtie/gibson) and Homebrew-proper (mac) without an OS branch.
run '$(brew --prefix tpm)/share/tpm/tpm'
